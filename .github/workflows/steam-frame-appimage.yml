name: Steam Frame 安装包

# 为 Valve Steam Frame（Snapdragon 8 Gen 3 / AArch64 / SteamOS）构建可导入机器的安装包。
#
# 两个产物：
#   1) clash-verge-steam-frame-installer.tar.gz
#      推荐路径。含一键安装器 + 托盘库（SteamOS 仓库和 AUR 都没有 libayatana-appindicator，
#      从 Ubuntu arm64 取现成的 .so 一起打包，安装器直接落位，目标机无需编译）。
#   2) Clash.Verge_*_aarch64.AppImage
#      上游 tauri.linux.conf.json 把 bundle.targets 写死为 ["deb","rpm"]，官方 release 不产
#      AppImage。这里用 --config 覆盖后自行构建。
#      注意：AppImage 无法自带 WebKit —— WebKitGTK 的辅助进程路径 /usr/lib/webkit2gtk-4.1
#      是编译期硬编码且不支持 WEBKIT_EXEC_PATH，所以仍然需要系统提供 webkit2gtk-4.1。

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/steam-frame-appimage.yml'
      - 'steam-frame/**'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------- 推荐产物
  installer-bundle:
    name: 打包一键安装器
    # 原生 arm64 runner：为了取到 aarch64 版的托盘库
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 校验安装器语法
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash -n steam-frame/install-clash-verge-frame.sh
          shellcheck --severity=error steam-frame/install-clash-verge-frame.sh \
            || echo "::warning::shellcheck 报错，请检查"

      - name: 收集托盘库
        run: |
          sudo apt-get install -y libayatana-appindicator3-1 libayatana-indicator3-7
          mkdir -p steam-frame/payload/lib
          cp -av /usr/lib/aarch64-linux-gnu/libayatana-appindicator3.so* steam-frame/payload/lib/
          cp -av /usr/lib/aarch64-linux-gnu/libayatana-indicator3.so*        steam-frame/payload/lib/
          ls -la steam-frame/payload/lib/

      - name: 打包
        run: |
          # 完整文档只有一份，放在仓库根 README.md；这里复制进去随包分发，
          # 避免仓库里存在两份同样内容、改一份忘一份。
          cp README.md steam-frame/README.md
          tar -czf clash-verge-steam-frame-installer.tar.gz \
            steam-frame/install-clash-verge-frame.sh \
            steam-frame/README.md \
            steam-frame/payload
          sha256sum clash-verge-steam-frame-installer.tar.gz > SHA256SUMS.txt
          tar -tzf clash-verge-steam-frame-installer.tar.gz | head -20
          ls -lh clash-verge-steam-frame-installer.tar.gz

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: clash-verge-steam-frame-installer
          path: |
            clash-verge-steam-frame-installer.tar.gz
            SHA256SUMS.txt
          if-no-files-found: error

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: steam-frame-latest
          name: Clash Verge Rev — Steam Frame (ARM64)
          body: |
            Valve Steam Frame（Snapdragon 8 Gen 3 / AArch64 / SteamOS）适配产物。

            **推荐**：`clash-verge-steam-frame-installer.tar.gz`

            ```bash
            tar -xzf clash-verge-steam-frame-installer.tar.gz
            cd steam-frame
            chmod +x install-clash-verge-frame.sh
            ./install-clash-verge-frame.sh
            ```

            安装器会自动补齐 webkit2gtk-4.1、把程序装进 `~/.local`、注册桌面项，
            并调用 `steamos-add-to-steam` 把它加进 Steam Frame 的库。

            详见包内 `README.md`。
          files: |
            clash-verge-steam-frame-installer.tar.gz
            SHA256SUMS.txt
          draft: false

  # ---------------------------------------------------------------- 额外产物
  appimage:
    name: 构建 ARM64 AppImage
    runs-on: ubuntu-22.04-arm
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file ca-certificates \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev squashfs-tools desktop-file-utils zsync
          sudo apt-get install -y --no-install-recommends libfuse2 \
            || sudo apt-get install -y --no-install-recommends libfuse2t64

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1-rust'
          key: 'steam-frame-aarch64-unknown-linux-gnu'
          workspaces: |
            . -> target
          save-if: true

      - name: 安装依赖与 sidecar
        run: |
          pnpm i
          pnpm run prebuild aarch64-unknown-linux-gnu

      - name: 构建 AppImage
        env:
          # linuxdeploy 自身也是 AppImage，runner 上不保证能挂载 FUSE
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: |
          pnpm build \
            --target aarch64-unknown-linux-gnu \
            --config "$PWD/steam-frame/tauri.appimage.conf.json"

      - name: 收集
        run: |
          mkdir -p out
          cp target/aarch64-unknown-linux-gnu/release/bundle/appimage/*.AppImage out/
          sha256sum out/*.AppImage > out/SHA256SUMS-appimage.txt
          ls -lh out/

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: clash-verge-steam-frame-appimage
          path: |
            out/*.AppImage
            out/SHA256SUMS-appimage.txt
          if-no-files-found: error

      - name: 追加到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: steam-frame-latest
          files: |
            out/*.AppImage
            out/SHA256SUMS-appimage.txt

  # ---------------------------------------------------------------- Windows 管理器
  # 管理器是 C# WinForms 程序，只能在 Windows 上编译，Linux 作业产不出它。
  windows-manager:
    name: 编译 Windows 图形界面管理器
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 定位 Roslyn 编译器
        id: csc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "找不到 vswhere.exe" }
          $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vs) { throw "找不到 Visual Studio 安装" }
          $csc = Join-Path $vs "MSBuild\Current\Bin\Roslyn\csc.exe"
          if (-not (Test-Path $csc)) { throw "找不到 csc.exe：$csc" }
          "path=$csc" >> $env:GITHUB_OUTPUT
          & $csc /version

      - name: 编译 askpass（必须是控制台子系统）
        shell: pwsh
        working-directory: steam-frame
        run: |
          $csc = "${{ steps.csc.outputs.path }}"
          & $csc /nologo /codepage:65001 /platform:anycpu /target:exe /out:askpass.exe askpass.cs
          if ($LASTEXITCODE -ne 0) { throw "askpass.exe 编译失败" }
          Write-Host "askpass.exe = $((Get-Item askpass.exe).Length) 字节"

      - name: 编译管理器（GUI + CLI 两个版本）
        shell: pwsh
        working-directory: steam-frame
        run: |
          $csc = "${{ steps.csc.outputs.path }}"
          $refs = @(
            '/r:System.dll', '/r:System.Core.dll', '/r:System.Drawing.dll',
            '/r:System.Windows.Forms.dll', '/r:System.Net.Http.dll', '/r:System.Security.dll'
          )
          # 四个资源少一个都会在运行时报「内置资源缺失」
          $res = @(
            '/resource:push-subscription.py', '/resource:askpass.exe',
            '/resource:steam-shortcuts.py', '/resource:uninstall-clash-verge-frame.sh'
          )
          $targets = @(
            @{ kind = 'winexe'; out = 'ClashVergeFrameManager.exe' },
            @{ kind = 'exe';    out = 'cvframe-cli.exe' }
          )
          foreach ($t in $targets) {
            & $csc /nologo /codepage:65001 /platform:anycpu "/target:$($t.kind)" @refs @res "/out:$($t.out)" manager.cs
            if ($LASTEXITCODE -ne 0) { throw "$($t.out) 编译失败" }
            Write-Host "$($t.out) = $((Get-Item $t.out).Length) 字节"
          }

      - name: 校验四个资源确实内嵌进去了
        shell: pwsh
        working-directory: steam-frame
        run: |
          # 编译成功只说明文件存在，不代表打进去了；直接在二进制里找资源名。
          # （不用 Assembly.LoadFile：pwsh 跑在 .NET Core 上，加载 .NET Framework
          #   的 WinForms 程序集可能失败。）
          # 注意：读不到文件必须当失败处理 —— 否则路径写错时会"空数组 = 没缺"，
          # 校验变成永远通过，等于没有。
          $want = @('push-subscription.py','askpass.exe','steam-shortcuts.py','uninstall-clash-verge-frame.sh')
          $failed = $false
          foreach ($name in @('ClashVergeFrameManager.exe','cvframe-cli.exe')) {
            $p = (Resolve-Path $name -ErrorAction SilentlyContinue)
            if (-not $p) { Write-Host "::error::$name 不存在"; $failed = $true; continue }
            $bytes = [System.IO.File]::ReadAllBytes($p.Path)
            if ($bytes.Length -eq 0) { Write-Host "::error::$name 是空文件"; $failed = $true; continue }
            $text = [System.Text.Encoding]::UTF8.GetString($bytes)
            $miss = @($want | Where-Object { -not $text.Contains($_) })
            if ($miss.Count -gt 0) {
              Write-Host "::error::$name 缺少内嵌资源: $($miss -join ', ')"
              $failed = $true
            } else {
              Write-Host "$name ($($bytes.Length) 字节) 的四个资源都在"
            }
          }
          if ($failed) { throw "资源内嵌校验未通过" }

      - name: 生成校验和
        shell: pwsh
        working-directory: steam-frame
        run: |
          $lines = foreach ($f in @('ClashVergeFrameManager.exe','cvframe-cli.exe')) {
            "$((Get-FileHash $f -Algorithm SHA256).Hash.ToLower())  $f"
          }
          Set-Content -Path SHA256SUMS-windows.txt -Value $lines -Encoding ascii
          Get-Content SHA256SUMS-windows.txt

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: clash-verge-steam-frame-windows-manager
          path: |
            steam-frame/ClashVergeFrameManager.exe
            steam-frame/cvframe-cli.exe
            steam-frame/SHA256SUMS-windows.txt
          if-no-files-found: error

      - name: 追加到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: steam-frame-latest
          files: |
            steam-frame/ClashVergeFrameManager.exe
            steam-frame/cvframe-cli.exe
            steam-frame/SHA256SUMS-windows.txt

  # ---------------------------------------------------------------- 离线 zip 发放包
  # 面向最终用户的单一下载：Windows 管理器 + 离线自解压安装器 + 脚本 + 文档。
  #
  # 载荷（app/ lib/ webkit/）在 runner 上现场拉取后塞进 .run 的 __PAYLOAD_BELOW__
  # 之后，所以既不占 git 空间，也不会触及 GitHub 的 100 MB 单文件限制。
  # webkit 的版本号不写死：直接读仓库数据库里的 FILENAME，与 pacman 的解析结果一致。
  release-zip:
    name: 打包离线 zip 发放包
    needs: [windows-manager]
    runs-on: ubuntu-22.04-arm
    env:
      ZIP_VERSION: v1.1
      STEAMOS_REPO: https://holo-packages.steamos.cloud/archlinux-deckard/archlinux/main
      WEBKIT_PKGS: webkit2gtk-4.1 harfbuzz-icu hyphen libmanette libwpe woff2 wpebackend-fdo
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 安装工具与托盘库
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl zstd zip libayatana-appindicator3-1 libayatana-indicator3-7
          zstd --version
          zip -v | head -2

      - name: 取 Windows 管理器产物
        uses: actions/download-artifact@v7
        with:
          name: clash-verge-steam-frame-windows-manager
          path: artifacts/windows

      - name: 组装载荷 app 与 lib
        run: |
          set -euo pipefail
          mkdir -p payload/app payload/lib payload/webkit

          # SteamOS 仓库和 AUR 都没有 aarch64 的 libayatana-appindicator，
          # 托盘库只能从 Ubuntu arm64 取现成的二进制。
          cp -a /usr/lib/aarch64-linux-gnu/libayatana-appindicator3.so* payload/lib/
          cp -a /usr/lib/aarch64-linux-gnu/libayatana-indicator3.so*        payload/lib/
          ls -la payload/lib/

          # 程序本体：上游最新 arm64 deb
          REL_JSON="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/clash-verge-rev/clash-verge-rev/releases/latest)"
          DEB_URL="$(printf '%s' "$REL_JSON" | grep -oE 'https://[^"]+_arm64\.deb' | head -1)"
          [ -n "$DEB_URL" ] || { echo "::error::上游 release 里找不到 arm64.deb"; exit 1; }
          echo "上游安装包：$(basename "$DEB_URL")"
          curl -fL --retry 3 --max-time 900 -o "payload/app/$(basename "$DEB_URL")" "$DEB_URL"
          ls -la payload/app/

      - name: 组装载荷 webkit
        run: |
          set -euo pipefail
          DB="$(mktemp)"
          DB_DIR="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$DB" "$STEAMOS_REPO/extra/os/aarch64/extra.db"
          tar -xf "$DB" -C "$DB_DIR"

          # 逐个 desc 里读 NAME/FILENAME，比通配符匹配稳
          : > files.txt
          for d in "$DB_DIR"/*/; do
            [ -f "$d/desc" ] || continue
            n="$(sed -n '/^%NAME%$/{n;p;q}' "$d/desc")"
            case " $WEBKIT_PKGS " in
              *" $n "*)
                fn="$(sed -n '/^%FILENAME%$/{n;p;q}' "$d/desc")"
                [ -n "$fn" ] && echo "$fn" >> files.txt
                ;;
            esac
          done

          echo "解析到 $(wc -l < files.txt) 个包："
          sort files.txt
          [ -s files.txt ] || { echo "::error::没解析到任何 webkit 包"; exit 1; }

          while read -r fn; do
            curl -fsSL --retry 3 --max-time 600 \
              -o "payload/webkit/$fn" "$STEAMOS_REPO/extra/os/aarch64/$fn"
          done < files.txt

          ls -la payload/webkit/
          # 至少要拿到 webkit2gtk-4.1 本身，否则离线载荷没有意义
          ls payload/webkit/webkit2gtk-4.1-*.pkg.tar.* >/dev/null 2>&1 \
            || { echo "::error::没拿到 webkit2gtk-4.1 包"; exit 1; }
          [ "$(wc -l < files.txt)" -eq 7 ] \
            || echo "::warning::期望 7 个 webkit 包，实际 $(wc -l < files.txt) 个"

      - name: 生成自解压安装器
        run: |
          set -euo pipefail
          tar --zstd -cf payload.tar.zst -C payload app lib webkit
          # install-clash-verge-frame.sh 末尾自带 __PAYLOAD_BELOW__ 标记
          cat steam-frame/install-clash-verge-frame.sh payload.tar.zst > install-clash-verge-frame.run
          chmod +x install-clash-verge-frame.run
          grep -aq '^__PAYLOAD_BELOW__$' install-clash-verge-frame.run \
            || { echo "::error::缺少 __PAYLOAD_BELOW__ 标记"; exit 1; }
          ls -lh install-clash-verge-frame.run

      - name: 组装 zip
        run: |
          set -euo pipefail
          D="ClashVerge-SteamFrame-${ZIP_VERSION}"
          mkdir -p "$D"
          cp artifacts/windows/ClashVergeFrameManager.exe artifacts/windows/cvframe-cli.exe "$D/"
          cp install-clash-verge-frame.run "$D/"
          cp steam-frame/push-subscription.py steam-frame/steam-shortcuts.py \
             steam-frame/uninstall-clash-verge-frame.sh "$D/"
          cp steam-frame/gui-screenshot.png "$D/"
          cp "steam-frame/快速开始.md" "$D/"
          cp README.md "$D/README.md"
          (
            cd "$D"
            sha256sum ClashVergeFrameManager.exe cvframe-cli.exe install-clash-verge-frame.run \
                      push-subscription.py steam-shortcuts.py uninstall-clash-verge-frame.sh \
                      README.md 快速开始.md gui-screenshot.png > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )
          zip -r -1 "${D}.zip" "$D"
          ls -lh "${D}.zip"
          sha256sum "${D}.zip" > SHA256SUMS-zip.txt
          cat SHA256SUMS-zip.txt

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: clash-verge-steam-frame-zip
          path: |
            ClashVerge-SteamFrame-*.zip
            SHA256SUMS-zip.txt
          if-no-files-found: error

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: steam-frame-latest
          files: |
            ClashVerge-SteamFrame-*.zip
            SHA256SUMS-zip.txt
